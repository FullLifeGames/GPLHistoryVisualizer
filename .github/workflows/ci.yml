name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check web JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/i18n.js
          node --check web/router.js
          node --check web/stats.js

      - name: Run web unit tests
        run: node --test tests/web_i18n.test.mjs tests/web_router.test.mjs tests/web_stats.test.mjs

      - name: Validate normalized CSVs
        run: gpl-history validate --data-dir data

      - name: Build review queues
        run: gpl-history review-queue --data-dir data
