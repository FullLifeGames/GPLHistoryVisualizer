name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: ["master", "main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static site artifact
        run: |
          mkdir -p site/data
          cp -r web site/web
          cp -r data/normalized site/data/normalized
          cp GPL_Season_10_Logo.png site/GPL_Season_10_Logo.png
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./web/index.html">
          <title>GPL History Visualizer</title>
          <a href="./web/index.html">GPL History Visualizer</a>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
