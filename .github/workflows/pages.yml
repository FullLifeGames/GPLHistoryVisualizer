name: Deploy static archive

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Check generated artifacts
        run: python -m gpl_history.cli check-generated --data-dir data

      - name: Validate normalized CSVs
        run: python -m gpl_history.cli validate --data-dir data

      - name: Run Python tests
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Web tests
        run: npm run test:js

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R web _site/web
          mkdir -p _site/data
          cp -R data/normalized _site/data/normalized
          cp -R data/review _site/data/review
          cp -R docs _site/docs
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="de">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=web/" />
              <title>GPL History Visualizer</title>
            </head>
            <body>
              <a href="web/">GPL History Visualizer öffnen</a>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
