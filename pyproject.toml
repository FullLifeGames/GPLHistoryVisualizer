[project]
name = "gpl-history"
version = "1.0.0"
description = "Reconstruct German Pokémon League history from normalized CSV and source-table data."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
]

[project.urls]
Repository = "https://github.com/FullLifeGames/GPLHistoryVisualizer"
Issues = "https://github.com/FullLifeGames/GPLHistoryVisualizer/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
drive-archive = [
  "google-api-python-client>=2.130.0",
  "google-auth-oauthlib>=1.2.0",
  "yt-dlp>=2024.5.27",
]
wrapped = [
  "Pillow>=10.0.0",
]

[project.scripts]
gpl-history = "gpl_history.cli:main"
gpl-drive-archive = "gpl_history.drive_archive:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
